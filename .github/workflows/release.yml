name: Release

# `claude plugin tag --push` が打つ `whatever-it-takes--vX.Y.Z` タグをトリガーにする。
on:
  push:
    tags:
      - "whatever-it-takes--v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X main.version=${{ github.ref_name }}" \
            -o "gatectl-${GOOS}-${GOARCH}" ./cmd/gatectl

      - name: bundle (実行に必要なものだけ + プリビルドバイナリ)
        # git clone も claude plugin install も使わず、ダウンロード・展開・配置だけで
        # 使えるようにするための、プラットフォーム別tarball。
        #
        # 実行時に使わないもの (Goソース、go.mod、install.sh自身、README) は
        # 含めない。.claude-pluginだけは例外で、無いとhooks/hooks.jsonが
        # 認識されずStopフックが動かなくなることを確認済みなので、必ず含める。
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          NAME="whatever-it-takes-${GOOS}-${GOARCH}"
          BUNDLE_DIR="dist/${NAME}/whatever-it-takes"
          mkdir -p "$BUNDLE_DIR/bin"
          cp -r SKILL.md scripts templates hooks .claude-plugin "$BUNDLE_DIR/"
          cp "gatectl-${GOOS}-${GOARCH}" "$BUNDLE_DIR/bin/gatectl"
          chmod +x "$BUNDLE_DIR/bin/gatectl" "$BUNDLE_DIR/scripts/ensure-gatectl.sh" "$BUNDLE_DIR/scripts/stop-guard.sh"
          tar -czf "${NAME}.tar.gz" -C "dist/${NAME}" whatever-it-takes

      - uses: actions/upload-artifact@v4
        with:
          name: gatectl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            gatectl-${{ matrix.goos }}-${{ matrix.goarch }}
            whatever-it-takes-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
